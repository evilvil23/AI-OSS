[server]
port = 8080
mode = 'release'
read_timeout = 60
write_timeout = 300

[storage]
root = './data/files'
disks = []
trash_path = ''
version_keep = 5
trash_days = 30
webdav_enabled = true
webdav_prefix = '/dav'

[storage.rclone]
enabled = false
remote = ''
schedule = ''

[tus]
enabled = true
path_prefix = '/files/upload/'
chunk_size = 5242880
max_size = 10737418240
store_dir = './data/tus'
concurrent_uploads = true
dedup = true

[auth]
jwt_secret = 'change-me-in-production'
jwt_expire = 86400
argon2_time = 3
argon2_memory = 65536
argon2_threads = 4
argon2_key_len = 32
argon2_salt_len = 16
admin_username = 'admin'
admin_password = 'admin123'

[ai]
ollama_host = 'http://localhost:11434'
default_model = 'qwen2:7b'
embedding_model = 'nomic-embed-text'
conversation_max_tokens = 4096
temperature = 0.7

[ai.rag]
enabled = true
store_type = 'chromem'
chunk_size = 512
chunk_overlap = 50
top_k = 5

[ai.rag.qdrant]
host = 'localhost'
port = 6334
api_key = ''
collection_name = 'file_chunks'

[iot]
[iot.mihome]
enabled = false
client_id = ''
client_secret = ''
redirect_uri = ''
api_base = ''

[iot.mqtt]
enabled = true
broker = 'tcp://localhost:1883'
client_id = 'smart-nas'
username = ''
password = ''

[plugin]
enabled = true
dir = './plugins'
auto_load = true
timeout = 30

[log]
level = 'info'
path = './data/logs/smart-nas.log'
max_size = 100
max_backups = 7
max_age = 30

[degradation]
auto_disable_rag_on_high_cpu = true
cpu_threshold = 0.85

[play]
enabled = true
max_online_height = 1440        # 最高在线播放分辨率高度（2K=1440），超出提示下载
ffmpeg_path = 'ffmpeg'          # 留空自动从 PATH 查找；优先使用 exe 同目录/运行目录下的内置二进制（v0.19）
ffprobe_path = 'ffprobe'
remux_concurrency = 3           # 转封装（-c copy）最大并发
transcode_concurrency = 1       # 实时转码最大并发（大开销，防止 NAS 过载）
transcode_threads = 2           # 单个转码任务线程数
ticket_ttl_minutes = 30         # 播放凭证无 Range 请求自动失效时长
cache_dir = './data/cache/video' # 转封装产物缓存目录
ip_bind = true                  # 播放凭证与请求 IP 绑定（防盗链）
