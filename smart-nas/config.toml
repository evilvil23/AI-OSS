[server]
port = 8080
mode = 'release'
read_timeout = 60
write_timeout = 300

[storage]
root = './data/files'
disks = []
trash_path = ''
metadata_db = ''
version_keep = 5
trash_days = 30
webdav_enabled = true
webdav_prefix = '/dav'

[storage.rclone]
enabled = false
remote = ''
schedule = ''

[tus]
enabled = true
path_prefix = '/files/upload/'
chunk_size = 5242880
max_size = 10737418240
store_dir = './data/tus'
concurrent_uploads = true
dedup = true

[auth]
jwt_secret = 'change-me-in-production'
jwt_expire = 86400
argon2_time = 3
argon2_memory = 65536
argon2_threads = 4
argon2_key_len = 32
argon2_salt_len = 16
admin_username = 'admin'
admin_password = 'admin123'

[ai]
ollama_host = 'http://localhost:11434'
default_model = 'deepseek-r1:7b'
embedding_model = 'nomic-embed-text'
conversation_max_tokens = 4096
temperature = 0.7

[ai.rag]
enabled = true
store_type = 'chromem'
chunk_size = 512
chunk_overlap = 50
top_k = 5

[ai.rag.qdrant]
host = 'localhost'
port = 6334
api_key = ''
collection_name = 'file_chunks'

[ai.ollama]
managed = true
binary = ''
bind_host = '127.0.0.1:11434'
start_timeout = 60
auto_warmup = true

[ai.tune]
model = ''
num_ctx = 0
keep_alive = ''
num_parallel = 0

[ai.deploy]
mode = 'auto'
role = 'primary'
remote_host = ''
remote_model = ''
remote_api = ''
remote_username = ''
remote_password = ''
auto_switch = true
check_interval = 30

[ai.homeassistant]
enabled = false
base_url = 'http://homeassistant.local:8123'
token = ''

[iot]
[iot.mihome]
enabled = false
client_id = ''
client_secret = ''
redirect_uri = ''
api_base = ''

[iot.mqtt]
enabled = true
broker = 'tcp://localhost:1883'
client_id = 'smart-nas'
username = ''
password = ''

[plugin]
enabled = true
dir = './plugins'
auto_load = true
timeout = 30

[log]
level = 'info'
path = './data/logs/smart-nas.log'
max_size = 100
max_backups = 7
max_age = 30

[degradation]
auto_disable_rag_on_high_cpu = true
cpu_threshold = 0.85

[play]
enabled = true
max_online_height = 1440
ffmpeg_path = 'ffmpeg'
ffprobe_path = 'ffprobe'
remux_concurrency = 3
transcode_concurrency = 1
transcode_threads = 2
ticket_ttl_minutes = 30
cache_dir = './data/cache/video'
ip_bind = true

[backup]
enabled = true
db_path = './data/backup/backup.db'
log_path = './data/logs/backup.log'
watch_interval = 30
usb_poll_interval = 3
